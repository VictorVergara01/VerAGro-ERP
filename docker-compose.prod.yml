# Stack de producción: PostgreSQL + backend (Gunicorn).
# Las variables se leen de .env.prod (ver .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py collectstatic --noinput
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py createsuperuser
#
# El backend escucha solo en localhost:8000; el Nginx del host hace de reverse proxy + TLS.
# WhiteNoise sirve /static/; /media/ (subidas) se sirve desde el bind mount ./backend/media.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Usa el CMD del Dockerfile (Gunicorn). NO se sobreescribe el comando.
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - ./backend/media:/app/media     # subidas (fotos, logo) → las sirve Nginx del host
      - ./backend/static:/app/static   # estáticos colectados (WhiteNoise los sirve igual)
    ports:
      # Por defecto solo localhost. Para exponerlo a un reverse proxy externo
      # (p. ej. Nginx Proxy Manager en otro contenedor), pon BIND_ADDR=0.0.0.0 en .env.prod.
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    # Panel web (Vite/React) servido por Nginx. VITE_API_URL se hornea en el build
    # (se toma de .env.prod → no queda en el repo). Coloca el APK en
    # frontend/public/downloads/veragro.apk antes de construir para el botón de descarga.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:80"
    depends_on:
      - backend

  cloudflared:
    # OPCIONAL (perfil "tunnel"): túnel de Cloudflare dedicado para este stack.
    # Solo arranca con COMPOSE_PROFILES=tunnel. Si publicas con un reverse proxy
    # externo (Nginx Proxy Manager, etc.) no lo necesitas: deja el perfil sin activar.
    # Alcanza los servicios por nombre de red: api→backend:8000, erp→web:80.
    # TUNNEL_TOKEN va en .env.prod (no se versiona).
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - backend
      - web

volumes:
  postgres_data_prod:
