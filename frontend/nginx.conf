# Config de Nginx para servir el panel web (SPA de React/Vite).
# Sirve para el contenedor (Dockerfile.prod) o como referencia para tu Nginx de Proxmox.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre → cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router resuelve en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
